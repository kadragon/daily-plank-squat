<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <style>
    .bg  { fill: #f5f5f5; }
    .arc { stroke: #111111; }
    .dot { fill: #111111; }
    @media (prefers-color-scheme: dark) {
      .bg  { fill: #111111; }
      .arc { stroke: #ffffff; }
      .dot { fill: #ffffff; }
    }
  </style>
  <rect class="bg" width="100" height="100" rx="20"/>
  <circle class="arc" cx="50" cy="52" r="28" stroke-width="8" fill="none"
          stroke-dasharray="122 53" stroke-linecap="round"
          transform="rotate(-105 50 52)"/>
  <line x1="50" y1="52" x2="50" y2="30" stroke="#d30005" stroke-width="7" stroke-linecap="round"/>
  <circle class="dot" cx="50" cy="52" r="4"/>
</svg>
